<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Computer Science Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-box">

<h2>Create Account</h2>

<p style="text-align:center;color:#d1d5db;margin-bottom:25px;">

Create your free account to start playing quizzes.

</p>

<form id="signupForm">

<div class="input-box">

<label>Full Name</label>

<input
type="text"
id="fullname"
placeholder="Enter your full name"
required>

</div>

<div class="input-box">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Choose a username"
required>

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create a password"
required>

</div>

<div class="input-box">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

</div>

<button
type="submit"
class="auth-btn">

Create Account

</button>

</form>

<div style="text-align:center;margin-top:25px;">

Already have an account?

<a href="login.html"
style="color:#60a5fa;text-decoration:none;">

Login

</a>

</div>
</div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit",function(e){

e.preventDefault();

let fullname=document.getElementById("fullname").value.trim();

let username=document.getElementById("username").value.trim();

let password=document.getElementById("password").value.trim();

let confirm=document.getElementById("confirmPassword").value.trim();

if(password!==confirm){

alert("Passwords do not match!");

return;

}

localStorage.setItem("fullname",fullname);

localStorage.setItem("username",username);

localStorage.setItem("password",password);

alert("Account Created Successfully!");

window.location.href="login.html";

});

</script>

</body>

</html>
